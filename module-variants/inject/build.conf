# AlwaysStrong build config — PlayIntegrityFix inject-s line (the -inject build).
#
# Sourced by build.sh. Files in ship/ are overlaid onto module/ and end up in
# the zip; everything at this level is build-time only and is never shipped.
# scripts/update-upstream.sh rewrites the PIF_TAG / PIF_ASSET lines below, so
# each line's upstream pin lives with the line instead of in a shared file.

# Asset name suffix, so both lines can sit in one release.
ZIP_SUFFIX="-inject"

# Upstream Play Integrity engine.
# v4.7 revision 1 (same release tag): fixes "auto security patch trigger" +
# "file not created", drops a redundant accessFlags. Same zip layout as v4.7.
PIF_REPO="KOWX712/PlayIntegrityFix"
PIF_TAG="v4.7-inject-s"
PIF_ASSET="PlayIntegrityFix_v4.7-1-inject-s.zip"

# Only inject-s releases carry the zygisk this line needs; the same repo also
# publishes non-inject builds, so the update check filters on this.
PIF_ASSET_FILTER="inject-s"

# Files lifted out of the upstream zip into the module.
PIF_FILES="autopif.sh pif.prop security_patch.sh"

# Missing any of these means upstream changed its layout — fail loudly rather
# than ship a module whose fingerprint refresh silently does nothing.
PIF_REQUIRED="autopif.sh"

# Upstream scripts whose hardcoded /data/adb/modules/playintegrityfix paths get
# rewritten to our module id.
PIF_PATCH_PATHS="autopif.sh security_patch.sh"

# inject-s has no autopif4.sh to patch.
PATCH_AUTOPIF4_WGET=0
