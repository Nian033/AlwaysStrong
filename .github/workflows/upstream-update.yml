name: Upstream update

# Weekly check for a newer TEESimulator-RS (shared) and a newer Play Integrity
# engine for each release line. If anything moved, the pins are patched — in
# build.sh for TEE, in module-variants/<line>/build.conf for the engines — the
# zips are rebuilt to prove the new pins work, and one PR is opened.
#
# This used to fail — and email a red run — every morning: the API lookups were
# unauthenticated, so the shared 60 req/h per-runner-IP pool ran out. They are
# authenticated now, and a lookup that still fails is reported as a warning
# instead of a failed job, so a flaky upstream never lands in your inbox.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream releases
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ./scripts/update-upstream.sh --apply
          code=$?
          case $code in
            0)  echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            11) echo "changed=true"  >> "$GITHUB_OUTPUT" ;;
            *)  echo "changed=false" >> "$GITHUB_OUTPUT"
                echo "::warning title=Upstream check failed::update-upstream.sh exited $code — skipping this run" ;;
          esac
          exit 0

      - name: Build both lines with the new pins
        if: steps.check.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip unzip
          # committed native binaries: touch them newer than the sources so the
          # build packages them instead of needing Rust + the NDK on the runner
          find native -path '*/prebuilt/*' -type f -exec touch {} +
          ./build.sh

      - name: Open PR
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/upstream-bump
          commit-message: "chore: bump upstream pins"
          title: "chore: bump upstream pins"
          body: |
            Automated upstream bump. The pins now match the newest upstream
            release, **prereleases included** — TEESimulator-RS ships its
            freshest builds that way.

            Both zips built clean on CI with the new pins. Verify locally with:
            ```
            ./build.sh --clean
            ```

            Worth an eyeball when a Play Integrity tag moved: some repos publish
            several assets per tag, and the newest-uploaded one is what gets
            pinned.
          delete-branch: true
