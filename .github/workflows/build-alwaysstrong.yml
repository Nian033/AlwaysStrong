name: Build AlwaysStrong with Custom Upstreams

on:
  workflow_dispatch: # 支持网页端手动触发运行
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-assemble:
    name: Build Submodules and Package AlwaysStrong
    runs-on: ubuntu-latest

    steps:
      # 1. 检出 AlwaysStrong 模块外壳代码
      - name: Checkout AlwaysStrong Repository
        uses: actions/checkout@v4
        with:
          repository: evoker0/AlwaysStrong
          path: AlwaysStrong

      # 2. 配置 Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 配置 Android NDK (直接使用 GitHub 官方 runner 内置的 NDK)
      - name: Setup Android NDK
        run: |
          # 自动获取 runner 中预装的最新的 NDK 路径
          ANDROID_NDK_ROOT=$(ls -d $ANDROID_HOME/ndk/* | sort -V | tail -n 1)
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "NDK 路径已设置为: $ANDROID_NDK_ROOT"

      # 4. 配置 Rust 及 Android 交叉编译 Target
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      # 5. 编译 Enginex0/TEESimulator-RS
      - name: Checkout and Build TEESimulator-RS
        run: |
          git clone --recursive https://github.com/Enginex0/TEESimulator-RS.git TEESimulator-RS
          cd TEESimulator-RS
          cargo install cargo-ndk
          if [ -f "build.sh" ]; then
            chmod +x build.sh
            ./build.sh
          elif [ -f "Makefile" ]; then
            make
          else
            cargo ndk -t arm64-v8a -t armeabi-v7a -o ./target/android build --release
          fi

      # 6. 编译 KOWX712/PlayIntegrityFix
      - name: Checkout and Build PlayIntegrityFix
        run: |
          git clone --recursive https://github.com/KOWX712/PlayIntegrityFix.git PlayIntegrityFix
          cd PlayIntegrityFix
          chmod +x gradlew
          ./gradlew assembleRelease

      # 7. 替换编译产物并重新打包
      - name: Replace Components and Build Final Module Zip
        run: |
          echo "=== 正在替换 TEESimulator-RS 编译产物 ==="
          find TEESimulator-RS/ -type f \( -name "*.so" -o -name "teesimulator*" \) -exec cp -fv {} AlwaysStrong/ \; || true

          echo "=== 正在替换 PlayIntegrityFix 编译产物 ==="
          PIF_ZIP=$(find PlayIntegrityFix/ -name "*.zip" | head -n 1)
          if [ -n "$PIF_ZIP" ]; then
            mkdir -p pif_extracted
            unzip -o "$PIF_ZIP" -d pif_extracted/
            cp -rfv pif_extracted/* AlwaysStrong/
          fi

          echo "=== 正在打包生成最终模块 ==="
          cd AlwaysStrong
          zip -r ../AlwaysStrong-Custom.zip . -x "*.git*" "*.github*"

      # 8. 上传结果
      - name: Upload AlwaysStrong Custom Module
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-Custom-Updated
          path: AlwaysStrong-Custom.zip
