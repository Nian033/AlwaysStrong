name: Build AlwaysStrong with Custom Upstreams

on:
  workflow_dispatch: # 支持在 GitHub 网页端手动点击运行
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-assemble:
    name: Build Submodules and Package AlwaysStrong
    runs-on: ubuntu-latest

    steps:
      # 1. 检出 AlwaysStrong 模块外壳代码
      - name: Checkout AlwaysStrong Repository
        uses: actions/checkout@v4
        with:
          repository: evoker0/AlwaysStrong
          path: AlwaysStrong

      # 2. 设置 Rust & Android NDK 环境
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: niku/setup-android-ndk@v1
        with:
          ndk-version: r26b

      # 3. 编译 Enginex0/TEESimulator-RS
      - name: Checkout and Build TEESimulator-RS
        run: |
          git clone --recursive https://github.com/Enginex0/TEESimulator-RS.git TEESimulator-RS
          cd TEESimulator-RS
          cargo install cargo-ndk
          if [ -f "build.sh" ]; then
            chmod +x build.sh
            ./build.sh
          elif [ -f "Makefile" ]; then
            make
          else
            cargo ndk -t arm64-v8a -t armeabi-v7a -o ./target/android build --release
          fi

      # 4. 编译 KOWX712/PlayIntegrityFix
      - name: Checkout and Build PlayIntegrityFix
        run: |
          git clone --recursive https://github.com/KOWX712/PlayIntegrityFix.git PlayIntegrityFix
          cd PlayIntegrityFix
          chmod +x gradlew
          ./gradlew assembleRelease

      # 5. 执行二进制文件替换与重新打包
      - name: Replace Components and Build Final Module Zip
        run: |
          echo "=== 正在替换 TEESimulator-RS 编译产物 ==="
          # 将 TEESimulator-RS 编译出来的文件替换到 AlwaysStrong 的对应位置
          find TEESimulator-RS/ -type f \( -name "*.so" -o -name "teesimulator*" \) -exec cp -fv {} AlwaysStrong/ \; || true

          echo "=== 正在替换 PlayIntegrityFix 编译产物 ==="
          # 解压编译好的 PlayIntegrityFix 或复制其 .so/核心依赖文件到 AlwaysStrong 中
          PIF_ZIP=$(find PlayIntegrityFix/app/build/outputs/ -name "*.zip" | head -n 1)
          if [ -n "$PIF_ZIP" ]; then
            mkdir -p pif_extracted
            unzip -o "$PIF_ZIP" -d pif_extracted/
            cp -rfv pif_extracted/* AlwaysStrong/
          fi

          echo "=== 正在打包生成最终模块 ==="
          cd AlwaysStrong
          zip -r ../AlwaysStrong-Custom.zip . -x "*.git*" "*.github*"

      # 6. 上传构建好的 ZIP 模块供下载
      - name: Upload AlwaysStrong Custom Module
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-Custom-Updated
          path: AlwaysStrong-Custom.zip
