name: Build AlwaysStrong

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build variant (leave empty = normal, inject = inject‑s)'
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt‑get update
          sudo apt‑get install -y wget unzip zip curl

      - name: Build module
        run: |
          chmod +x build.sh
          if [[ "${{ github.event.inputs.variant }}" == "inject" ]]; then
            ./build.sh inject
          else
            ./build.sh
          fi

      - name: Upload artifact
        uses: actions/upload‑artifact@v4
        with:
          name: AlwaysStrong‑build
          path: out/*.zip
